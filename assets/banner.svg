<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .card { fill: #fbfbfa; stroke: #e6e8eb; }
    .ink  { fill: #1a1c1f; }
    .bar  { fill: #d3d7dc; }
    .body { fill: #6b7280; }
    .nub  { fill: #4b5563; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #17181a; stroke: #2a2c2f; }
      .ink  { fill: #f4f5f6; }
      .bar  { fill: #383b40; }
      .body { fill: #9aa1ab; }
      .nub  { fill: #cbd2db; }
    }
  </style>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect class="card" x="6" y="6" width="1188" height="328" rx="26" filter="url(#soft)"/>

  <!-- wordmark -->
  <text class="ink" x="74" y="162" font-size="84" font-weight="800" letter-spacing="-2.5">Attention Span</text>
  <text x="76" y="216" font-size="30" font-weight="700" fill="#e8590c">pay attention, not tokens</text>

  <!-- wall of text-bars (grey). left edge x=812; centers y = 99,139,179,219,259 -->
  <g>
    <rect class="bar" x="812" y="90"  width="150" height="18" rx="9"/>
    <rect class="bar" x="812" y="130" width="190" height="18" rx="9"/>
    <rect class="bar" x="812" y="170" width="210" height="18" rx="9"/>
    <rect class="bar" x="812" y="210" width="150" height="18" rx="9"/>
    <rect class="bar" x="812" y="250" width="175" height="18" rx="9"/>
  </g>

  <!-- orange overlays: each bar lights exactly when the dot D is on it; bar 3 holds as "the answer" -->
  <g fill="#e8590c">
    <!-- bar 1  (dot arrives t=0 and again at loop end t=1) -->
    <rect x="812" y="90"  width="150" height="18" rx="9" opacity="1">
      <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;0.06;0.95;1" dur="6s" repeatCount="indefinite"/></rect>
    <!-- bar 2  (dot at t=0.12) -->
    <rect x="812" y="130" width="190" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.07;0.12;0.17;1" dur="6s" repeatCount="indefinite"/></rect>
    <!-- bar 3  (dot passes at t=0.24, then locks 0.62..0.90 as the answer) -->
    <rect x="812" y="170" width="210" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;1;1;0" keyTimes="0;0.19;0.24;0.29;0.585;0.62;0.90;1" dur="6s" repeatCount="indefinite"/></rect>
    <!-- bar 4  (dot at t=0.36) -->
    <rect x="812" y="210" width="150" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.31;0.36;0.41;1" dur="6s" repeatCount="indefinite"/></rect>
    <!-- bar 5  (dot at t=0.48) -->
    <rect x="812" y="250" width="175" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.43;0.48;0.53;1" dur="6s" repeatCount="indefinite"/></rect>
  </g>

  <!-- the laser beam: straight line from the emitter tip E(660,272) to the dot D(812, cy).
       x1,y1 fixed at E; x2 fixed at the bars' left edge; y2 sweeps through the bar centers. -->
  <line x1="660" y1="272" x2="812" y2="99" stroke="#e8590c" stroke-width="3" stroke-linecap="round" opacity="0.92">
    <animate attributeName="y2" values="99;139;179;219;259;179;179;99"
             keyTimes="0;0.12;0.24;0.36;0.48;0.62;0.90;1" calcMode="spline"
             keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
             dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- the laser pointer device. Drawn horizontally with its emitter tip glued to E(660,272),
       then ROTATED about E so the body stays collinear with the beam. angle = atan2(Dy-Ey, Dx-Ex). -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-48.70 660 272;-41.19 660 272;-31.46 660 272;-19.23 660 272;-4.89 660 272;-31.46 660 272;-31.46 660 272;-48.70 660 272"
      keyTimes="0;0.12;0.24;0.36;0.48;0.62;0.90;1" calcMode="spline"
      keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
      dur="6s" repeatCount="indefinite"/>
    <!-- pen body (tip at x=660 = E, tail extends backward to x=596) -->
    <rect class="body" x="596" y="264" width="64" height="16" rx="8"/>
    <!-- emitter nozzle at the front -->
    <rect class="nub" x="644" y="264" width="18" height="16" rx="8"/>
    <!-- emitter glow, glued to the pivot E -->
    <circle cx="660" cy="272" r="6" fill="#e8590c" filter="url(#glow)"/>
    <circle cx="660" cy="272" r="4" fill="#ffb37a"/>
  </g>

  <!-- glow halo, riding the dot D; pulses while locked on the answer -->
  <circle cx="812" cy="99" r="20" fill="#e8590c" filter="url(#glow)" opacity="0.18">
    <animate attributeName="cy" values="99;139;179;219;259;179;179;99"
             keyTimes="0;0.12;0.24;0.36;0.48;0.62;0.90;1" calcMode="spline"
             keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.18;0.5;0.3;0.5;0.18" keyTimes="0;0.60;0.70;0.80;0.90;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- the dot D itself, landing on each bar's left edge / vertical center -->
  <circle cx="812" cy="99" r="8" fill="#e8590c">
    <animate attributeName="cy" values="99;139;179;219;259;179;179;99"
             keyTimes="0;0.12;0.24;0.36;0.48;0.62;0.90;1" calcMode="spline"
             keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
             dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="812" cy="99" r="4" fill="#ffd0ab">
    <animate attributeName="cy" values="99;139;179;219;259;179;179;99"
             keyTimes="0;0.12;0.24;0.36;0.48;0.62;0.90;1" calcMode="spline"
             keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"
             dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
