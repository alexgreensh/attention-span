<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .card { fill: #fbfbfa; stroke: #e6e8eb; }
    .ink  { fill: #1a1c1f; }
    .bar  { fill: #d3d7dc; }
    .body { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #17181a; stroke: #2a2c2f; }
      .ink  { fill: #f4f5f6; }
      .bar  { fill: #383b40; }
      .body { fill: #9aa1ab; }
    }
  </style>

  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect class="card" x="6" y="6" width="1188" height="328" rx="26" filter="url(#soft)"/>

  <!-- wordmark -->
  <text class="ink" x="74" y="162" font-size="84" font-weight="800" letter-spacing="-2.5">Attention Span</text>
  <text x="76" y="216" font-size="30" font-weight="700" fill="#e8590c">pay attention, not tokens</text>

  <!-- wall of text-bars (grey) -->
  <g>
    <rect class="bar" x="812" y="90"  width="150" height="18" rx="9"/>
    <rect class="bar" x="812" y="130" width="190" height="18" rx="9"/>
    <rect class="bar" x="812" y="170" width="210" height="18" rx="9"/>
    <rect class="bar" x="812" y="210" width="150" height="18" rx="9"/>
    <rect class="bar" x="812" y="250" width="175" height="18" rx="9"/>
  </g>

  <!-- orange overlays: each bar lights as the laser passes; the middle one holds as "the answer" -->
  <g fill="#e8590c">
    <rect x="812" y="90"  width="150" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.05;0.1;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="812" y="130" width="190" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.08;0.11;0.14;0.2;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="812" y="170" width="210" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0.25;1;1;0" keyTimes="0;0.2;0.225;0.45;0.55;0.9;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="812" y="210" width="150" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.335;0.38;0.44;1" dur="5s" repeatCount="indefinite"/></rect>
    <rect x="812" y="250" width="175" height="18" rx="9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.45;0.5;0.56;1" dur="5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- the laser beam (the ray) -->
  <line x1="772" y1="296" x2="800" y2="99" stroke="#e8590c" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <animate attributeName="y2" values="99;259;179;179;99" keyTimes="0;0.45;0.55;0.9;1"
             calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/>
  </line>

  <!-- the laser pointer device (visible emitter) -->
  <g>
    <rect class="body" x="694" y="300" width="78" height="16" rx="8" transform="rotate(-19 733 308)"/>
    <rect fill="#4b5563" x="694" y="300" width="16" height="16" rx="8" transform="rotate(-19 733 308)"/>
    <circle cx="772" cy="296" r="6" fill="#e8590c" filter="url(#glow)"/>
    <circle cx="772" cy="296" r="4" fill="#ffb37a"/>
  </g>

  <!-- glow halo + dot, synced to the beam tip -->
  <circle cx="800" cy="99" r="20" fill="#e8590c" filter="url(#glow)" opacity="0.2">
    <animate attributeName="cy" values="99;259;179;179;99" keyTimes="0;0.45;0.55;0.9;1"
             calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.2;0.55;0.32;0.55;0.2" keyTimes="0;0.5;0.58;0.72;0.86;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="99" r="8" fill="#e8590c">
    <animate attributeName="cy" values="99;259;179;179;99" keyTimes="0;0.45;0.55;0.9;1"
             calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
